version: "3.9"

# Local development / optional Docker deployment, matching the SAME
# MySQL + no-Redis architecture as the cPanel production target (see
# README "cPanel Deployment" section) -- one consistent stack, not two
# diverging ones. If you deploy for real on a Postgres+Redis host instead
# of shared hosting, see the Phase 2 README history for the original
# Postgres/Redis/MinIO variant of this file.

x-php-image: &php-image
  build:
    context: ./backend
    dockerfile: ../docker/php/Dockerfile
  working_dir: /var/www/html
  volumes:
    - ./backend:/var/www/html
  environment:
    - CONTAINER_ROLE

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks: [npvams]

  app:
    <<: *php-image
    environment:
      - CONTAINER_ROLE=app
    depends_on:
      mysql:
        condition: service_healthy
    networks: [npvams]

  # Simulates the cron-driven queue worker described in the cPanel
  # deployment guide -- runs a short burst and exits, repeating every
  # minute, rather than a persistent Supervisor-managed process, so local
  # dev behaves the same way production will.
  queue-worker:
    <<: *php-image
    command: sh -c "while true; do php artisan queue:work --stop-when-empty --max-time=50; sleep 10; done"
    environment:
      - CONTAINER_ROLE=queue
    depends_on:
      - app
    networks: [npvams]

  scheduler:
    <<: *php-image
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    environment:
      - CONTAINER_ROLE=scheduler
    depends_on:
      - app
    networks: [npvams]

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: npvams
      MYSQL_USER: npvams
      MYSQL_PASSWORD: change_me_in_production
      MYSQL_ROOT_PASSWORD: change_me_in_production
    volumes:
      - mysqldata:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pchange_me_in_production"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [npvams]

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"
    networks: [npvams]

  vite:
    <<: *php-image
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      - CONTAINER_ROLE=vite
    networks: [npvams]

volumes:
  mysqldata:

networks:
  npvams:
    driver: bridge
